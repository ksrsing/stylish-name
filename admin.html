<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Panel - Stylish Name</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#080808;
    color:white;
    min-height:100vh;
}

header{
    background:linear-gradient(135deg,#6a00ff,#00c6ff);
    padding:25px 20px;
    text-align:center;
}

header h1{
    font-size:28px;
}

.container{
    max-width:900px;
    margin:30px auto;
    padding:20px;
}

.card{
    background:#151515;
    border:1px solid #333;
    border-radius:15px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 5px 20px #000;
}

.card h2{
    margin-bottom:15px;
    color:#00c6ff;
}

input,
textarea{
    width:100%;
    padding:13px;
    margin:8px 0;
    border:none;
    outline:none;
    border-radius:8px;
    background:#252525;
    color:white;
}

button{
    border:none;
    padding:12px 20px;
    border-radius:8px;
    background:linear-gradient(135deg,#6a00ff,#00c6ff);
    color:white;
    cursor:pointer;
    font-size:16px;
    margin-top:8px;
}

button:hover{
    opacity:.85;
}

.delete{
    background:#d60000;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

.stat{
    background:#202020;
    padding:20px;
    border-radius:12px;
    text-align:center;
}

.stat h3{
    font-size:28px;
    color:#00c6ff;
}

.message{
    margin-top:15px;
    padding:12px;
    background:#202020;
    border-radius:8px;
    display:none;
}

.name-item{
    padding:15px;
    margin-bottom:10px;
    background:#252525;
    border-radius:10px;
}

.status{
    margin-top:10px;
    padding:10px;
    border-radius:8px;
    background:#202020;
}

@media(max-width:600px){

    .stats{
        grid-template-columns:1fr;
    }

    header h1{
        font-size:22px;
    }
}
</style>
</head>

<body>

<header>
    <h1>⚙️ Stylish Name - Admin Panel</h1>
</header>

<div class="container">

    <!-- DASHBOARD -->
    <div class="card">

        <h2>📊 Dashboard</h2>

        <div class="stats">

            <div class="stat">
                <h3 id="nameCount">0</h3>
                <p>Names</p>
            </div>

            <div class="stat">
                <h3 id="visitCount">0</h3>
                <p>Visits</p>
            </div>

            <div class="stat">
                <h3>Online</h3>
                <p>Status</p>
            </div>

        </div>

        <div class="status" id="connectionStatus">
            Connecting to database...
        </div>

    </div>


    <!-- ADD NAME -->
    <div class="card">

        <h2>➕ Add Stylish Name</h2>

        <input
            type="text"
            id="nameInput"
            placeholder="Enter name"
        >

        <textarea
            id="styleInput"
            placeholder="Enter stylish version"
            rows="4"
        ></textarea>

        <button onclick="addName()">
            Add Name
        </button>

        <div
            class="message"
            id="message">
        </div>

    </div>


    <!-- SAVED NAMES -->
    <div class="card">

        <h2>📋 Saved Names</h2>

        <div id="nameList">
            Loading...
        </div>

    </div>


    <!-- WEBSITE -->
    <div class="card">

        <h2>🌐 Website</h2>

        <button onclick="openWebsite()">
            Open Stylish Name
        </button>

    </div>

</div>


<script>

/* =====================================
   SUPABASE SETTINGS
   ===================================== */

/*
   IMPORTANT:

   1. PASTE YOUR SUPABASE PROJECT URL
   2. PASTE YOUR PUBLISHABLE/ANON KEY

   DO NOT USE SECRET/SERVICE_ROLE KEY.
*/

const SUPABASE_URL =
"https://ujpzkpeslemcuizylymi.supabase.co";

const SUPABASE_KEY =
"sb_publishable_oT5xR6-pXK9vM9jlxvhydA_CgZs1qAB





eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVqcHprcGVzbGVtY3VpenlseW1pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk4NTY5OTYsImV4cCI6MjEwNTQzMjk5Nn0.n20U7Dm9eWVyCKguETwILxBQhuJJxD2ufIMt7zFCrCY";


/* CREATE SUPABASE CONNECTION */

const db =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =====================================
   MESSAGE
   ===================================== */

function showMessage(text){

    const message =
    document.getElementById("message");

    message.style.display = "block";

    message.innerText = text;

}


/* =====================================
   DATABASE CONNECTION TEST
   ===================================== */

async function testConnection(){

    const status =
    document.getElementById(
        "connectionStatus"
    );

    const { data, error } =
    await db
    .from("names")
    .select("id")
    .limit(1);

    if(error){

        console.error(error);

        status.innerText =
        "❌ Database connection error";

        return false;
    }

    status.innerText =
    "✅ Database connected";

    return true;
}


/* =====================================
   LOAD NAMES
   ===================================== */

async function loadNames(){

    const list =
    document.getElementById("nameList");

    list.innerHTML =
    "Loading...";


    const { data, error } =
    await db
    .from("names")
    .select("*")
    .order(
        "id",
        {ascending:false}
    );


    if(error){

        console.error(error);

        list.innerHTML =
        "❌ Error loading names";

        return;
    }


    document.getElementById(
        "nameCount"
    ).innerText =
    data.length;


    if(data.length === 0){

        list.innerHTML =
        "No names added yet.";

        return;
    }


    list.innerHTML = "";


    data.forEach(item => {

        const div =
        document.createElement("div");

        div.className =
        "name-item";


        const title =
        document.createElement("b");

        title.innerText =
        item.name;


        const br =
        document.createElement("br");


        const style =
        document.createElement("span");

        style.innerText =
        item.style;


        const br2 =
        document.createElement("br");


        const button =
        document.createElement("button");

        button.className =
        "delete";

        button.innerText =
        "Delete";


        button.onclick =
        function(){

            deleteName(item.id);

        };


        div.appendChild(title);

        div.appendChild(br);

        div.appendChild(style);

        div.appendChild(br2);

        div.appendChild(button);


        list.appendChild(div);

    });

}


/* =====================================
   ADD NAME
   ===================================== */

async function addName(){

    const name =
    document
    .getElementById("nameInput")
    .value
    .trim();


    const style =
    document
    .getElementById("styleInput")
    .value
    .trim();


    if(
        name === "" ||
        style === ""
    ){

        showMessage(
            "Please fill both fields."
        );

        return;
    }


    const { error } =
    await db
    .from("names")
    .insert([
        {
            name:name,
            style:style
        }
    ]);


    if(error){

        console.error(error);

        showMessage(
            "❌ " + error.message
        );

        return;
    }


    document
    .getElementById("nameInput")
    .value = "";


    document
    .getElementById("styleInput")
    .value = "";


    showMessage(
        "✅ Name added successfully!"
    );


    loadNames();

}


/* =====================================
   DELETE NAME
   ===================================== */

async function deleteName(id){

    const confirmDelete =
    confirm(
        "Are you sure you want to delete this name?"
    );


    if(!confirmDelete){

        return;
    }


    const { error } =
    await db
    .from("names")
    .delete()
    .eq("id",id);


    if(error){

        console.error(error);

        showMessage(
            "❌ " + error.message
        );

        return;
    }


    showMessage(
        "✅ Name deleted successfully!"
    );


    loadNames();

}


/* =====================================
   OPEN WEBSITE
   ===================================== */

function openWebsite(){

    window.open(
        "https://ksrsing.github.io/stylish-name/",
        "_blank"
    );

}


/* =====================================
   START
   ===================================== */

async function start(){

    const connected =
    await testConnection();


    if(connected){

        await loadNames();

    }

}


start();

</script>

</body>
</html>
