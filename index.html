/* =====================================================
UNICODE CONVERTER
===================================================== */

function unicodeFont(
    text,
    lower,
    upper
){

    const normalLower =
        "abcdefghijklmnopqrstuvwxyz";

    const normalUpper =
        "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

    return [...text].map(char=>{

        let index;

        index =
            normalLower.indexOf(char);

        if(index !== -1)
            return lower[index];

        index =
            normalUpper.indexOf(char);

        if(index !== -1)
            return upper[index];

        return char;

    }).join("");

}


function bold(text){

return unicodeFont(
    text,
    boldLower,
    boldUpper
);

}


function italic(text){

return unicodeFont(
    text,
    italicLower,
    italicUpper
);

}


function mono(text){

return unicodeFont(

}

return unicodeFont(

}

function smallCaps(text){

const map={
a:"ᴀ",b:"ʙ",c:"ᴄ",d:"ᴅ",e:"ᴇ",
f:"ғ",g:"ɢ",h:"ʜ",i:"ɪ",j:"ᴊ",
k:"ᴋ",l:"ʟ",m:"ᴍ",n:"ɴ",o:"ᴏ",
p:"ᴘ",q:"ǫ",r:"ʀ",s:"s",t:"ᴛ",
u:"ᴜ",v:"ᴠ",w:"ᴡ",x:"x",y:"ʏ",z:"ᴢ"
};

return [...text.toLowerCase()]
.map(c=>map[c]||c)
.join("");

}

function spaced(text){

function fullWidth(text){

return [...text].map(c=>{

const code=c.charCodeAt(0);

if(code>=33 && code<=126){

return String.fromCharCode(
code+65248
);

}

if(c===" ") return "　";

return c;

}).join("");

}


function bubble(text){

const upper="ABCDEFGHIJKLMNOPQRSTUVWXYZ";

const symbols=[
"Ⓐ","Ⓑ","Ⓒ","Ⓓ","Ⓔ","Ⓕ","Ⓖ","Ⓗ","Ⓘ","Ⓙ",
"Ⓚ","Ⓛ","Ⓜ","Ⓝ","Ⓞ","Ⓟ","Ⓠ","Ⓡ","Ⓢ","Ⓣ",
"Ⓤ","Ⓥ","Ⓦ","Ⓧ","Ⓨ","Ⓩ"
];

return [...text.toUpperCase()]
.map(c=>{

const i=upper.indexOf(c);

return i>=0 ? symbols[i] : c;

})
.join("");

}

add(`⋆｡°✩ ${name} ✩°｡⋆`);
add(`☾ ${name} ☽`);
add(`𓆩 ${name} 𓆪`);
add(`୨୧ ${name} ୨୧`);
add(`✿ ${name} ✿`);
add(`❀ ${name} ❀`);
add(`☁ ${name} ☁`);

}

if(category==="Danger"){

add(`☠ ${name} ☠`);
add(`⚠ ${name} ⚠`);
add(`☣ ${name} ☣`);
add(`💀 ${name} 💀`);
add(`༒ ${name} ༒`);
add(`⚔ ${name} ⚔`);
add(`⛓ ${name} ⛓`);

}

if(category==="Lines"){

add(underline(name));
add(strike(name));
add(overline(name));
add(`━ ${name} ━`);
add(`═ ${name} ═`);
add(`─ ${name} ─`);
add(`━━━━ ${name} ━━━━`);
add(`════ ${name} ════`);
add(`╰─ ${name} ─╯`);
add(`╭─ ${name} ─╮`);

}

if(category==="Squiggle"){

add(`〰️ ${name} 〰️`);
add(`~ ${name} ~`);
add(`≈ ${name} ≈`);
add(`≋ ${name} ≋`);
add(`〰 ${name} 〰`);
add(`⌁ ${name} ⌁`);
add(`〜 ${name} 〜`);

}


/* 12 Unicode fonts × 50+ decorations */

for(
let f=0;
f<fonts.length;
f++
){

for(
let l=0;
l<left.length;
l++
){

for(
let r=0;
r<right.length;
r++
){

add(
`${left[l]} ${fonts[f]} ${right[r]}`
);

if(result.length>=1600)
break;

}

if(result.length>=1600)
break;

}

if(result.length>=1600)
break;

}


/* More text transformations */

const transforms=[

x=>x,
x=>bold(x),
x=>italic(x),
x=>mono(x),
x=>sansBold(x),
x=>sansItalic(x),
x=>script(x),
x=>doubleText(x),
x=>fraktur(x),
x=>smallCaps(x),
x=>fullWidth(x),
x=>bubble(x),
x=>underline(x),
x=>strike(x),
x=>overline(x),
x=>dotText(x),
x=>spaced(x)

];


for(
let i=0;
i<transforms.length;
i++
){

const t=
transforms[i](name);

add(t);

add(`『${t}』`);
add(`【${t}】`);
add(`꧁${t}꧂`);
add(`亗${t}亗`);
add(`乂${t}乂`);
add(`♛${t}♛`);
add(`♡${t}♡`);
add(`★${t}★`);
add(`✦${t}✦`);
add(`⚡${t}⚡`);

}


return result.slice(0,1600);

}


/* =====================================================
GENERATE FROM INPUT
===================================================== */

function generate(){

const name=
document
.getElementById("nameInput")
.value
.trim();

if(!name){

showToast(
"Enter your name first"
);

return;

}

generatedStyles=
generateStyles(
name,
currentCategory
);

currentPage=1;

totalPages=
Math.max(
1,
Math.ceil(
generatedStyles.length/
PAGE_SIZE
)
);

renderGenerated();

}


/* =====================================================
RENDER GENERATED
===================================================== */

function renderGenerated(){

const results=
document.getElementById("results");

results.innerHTML="";

const start=
(currentPage-1)*PAGE_SIZE;

const page=
generatedStyles.slice(
start,
start+PAGE_SIZE
);


page.forEach(
(text,index)=>{

createCard(
text,
index,
results
);

});


if(!page.length){

results.innerHTML=
`<div class="loading">
No styles found.
</div>`;

}

updatePagination();

}


/* =====================================================
CARD
===================================================== */

function createCard(
text,
index,
parent
){

const card=
document.createElement("div");

card.className="nameCard";


const content=
document.createElement("div");

content.className=
"nameContent f"+
((index%20)+1);

content.textContent=text;


const actions=
document.createElement("div");

actions.className="cardActions";


const copy=
document.createElement("button");

copy.className=
"actionBtn copyBtn";

copy.textContent="COPY";

copy.onclick=()=>{
copyName(text);
};


const deco=
document.createElement("button");

deco.className=
"actionBtn";

deco.textContent="✨ DECO";

deco.onclick=()=>{

const preview=
document.getElementById(
"previewText"
);

preview.textContent=text;

preview.className=
"previewText f"+
((index%20)+1);

saveRecent(
text,
"f"+((index%20)+1)
);

};


actions.appendChild(copy);
actions.appendChild(deco);

card.appendChild(content);
card.appendChild(actions);

parent.appendChild(card);

}


/* =====================================================
COPY
===================================================== */

async function copyName(text){

try{

await navigator.clipboard.writeText(text);

showToast("Name copied!");

}catch(e){

const temp=
document.createElement("textarea");

temp.value=text;

document.body.appendChild(temp);

temp.select();

document.execCommand("copy");

temp.remove();

showToast("Name copied!");

}

}


/* =====================================================
CATEGORY
===================================================== */

function selectCategory(
category,
button
){

currentCategory=category;

document
.querySelectorAll(".catBtn")
.forEach(
btn=>btn.classList.remove("active")
);

button.classList.add("active");

const name=
document
.getElementById("nameInput")
.value
.trim();

if(name){

generate();

}else{

loadDatabaseNames(category);

}

}


/* =====================================================
SUPABASE LOAD
===================================================== */

async function loadDatabaseNames(category){

const results=
document.getElementById("results");

results.innerHTML=
`<div class="loading">
Loading names...
</div>`;

currentPage=1;

let query=
supabaseClient
.from("names")
.select(
"id,name,category",
{count:"exact"}
)
.order(
"id",
{ascending:false}
);

if(category!=="All"){

query=
query.eq(
"category",
category
);

}

const {
data,
error,
count
}=
await query.range(
0,
PAGE_SIZE-1
);

if(error){

console.error(error);

results.innerHTML=
`<div class="loading">
Database connection error.
</div>`;

return;

}

dbNames=data||[];

totalPages=
Math.max(
1,
Math.ceil(
(count||dbNames.length)/
PAGE_SIZE
)
);

renderDatabase();

}


/* =====================================================
DATABASE RENDER
===================================================== */

function renderDatabase(){

const results=
document.getElementById("results");

results.innerHTML="";

dbNames.forEach(
(item,index)=>{

createCard(
item.name,
index,
results
);

});

if(!dbNames.length){

results.innerHTML=
`<div class="loading">
No names found in this category.
</div>`;

}

updatePagination();

}


/* =====================================================
DATABASE PAGE
===================================================== */

async function loadDatabasePage(){

const results=
document.getElementById("results");

results.innerHTML=
`<div class="loading">
Loading...
</div>`;

let query=
supabaseClient
.from("names")
.select(
"id,name,category",
{count:"exact"}
)
.order(
"id",
{ascending:false}
);

if(currentCategory!=="All"){

query=
query.eq(
"category",
currentCategory
);

}

const from=
(currentPage-1)*PAGE_SIZE;

const to=
from+PAGE_SIZE-1;

const {
data,
error,
count
}=
await query.range(
from,
to
);

if(error){

console.error(error);

results.innerHTML=
`<div class="loading">
Unable to load names.
</div>`;

return;

}

dbNames=data||[];

totalPages=
Math.max(
1,
Math.ceil(
(count||0)/PAGE_SIZE
)
);

renderDatabase();

}


/* =====================================================
PAGINATION
===================================================== */

function updatePagination(){

document
.getElementById("pageInfo")
.textContent=
`Page ${currentPage} / ${totalPages}`;

document
.getElementById("prevBtn")
.disabled=
currentPage<=1;

document
.getElementById("nextBtn")
.disabled=
currentPage>=totalPages;

}


function nextPage(){

if(currentPage>=totalPages)
return;

currentPage++;

const name=
document
.getElementById("nameInput")
.value
.trim();

if(name){

renderGenerated();

}else{

loadDatabasePage();

}

}


function previousPage(){

if(currentPage<=1)
return;

currentPage--;

const name=
document
.getElementById("nameInput")
.value
.trim();

if(name){

renderGenerated();

}else{

loadDatabasePage();

}

}


/* =====================================================
CLEAR
===================================================== */

function clearInput(){

document
.getElementById("nameInput")
.value="";

generatedStyles=[];

const preview=
document.getElementById(
"previewText"
);

preview.textContent=
"꧁༺ NameCraft ༻꧂";

preview.className=
"previewText";

loadDatabaseNames(
currentCategory
);

}


/* =====================================================
RECENT
===================================================== */

function saveRecent(
text,
font
){

let recent=
JSON.parse(
localStorage.getItem(
"namecraft_recent"
)||"[]"
);

recent=
recent.filter(
item=>item.text!==text
);

recent.unshift({
text:text,
font:font
});

recent=
recent.slice(0,10);

localStorage.setItem(
"namecraft_recent",
JSON.stringify(recent)
);

renderRecent();

}


function renderRecent(){

const list=
document.getElementById(
"recentList"
);

list.innerHTML="";

const recent=
JSON.parse(
localStorage.getItem(
"namecraft_recent"
)||"[]"
);

if(!recent.length){

list.innerHTML=
`<div class="loading">
Your recent styles will appear here.
</div>`;

return;

}

recent.forEach(item=>{

const div=
document.createElement("div");

div.className=
`recentItem ${item.font}`;

div.textContent=
item.text;

div.onclick=()=>{
copyName(item.text);
};

list.appendChild(div);

});

}

SHARE

function getShareText(){

const text=
document
.getElementById("previewText")
.textContent;

return encodeURIComponent(
"Check my stylish name: "+text
);

}

const url=
encodeURIComponent(
location.href
);

`https://www.facebook.com/sharer/sharer.php?u=${url}`,

);

}

);

}


function shareTelegram(){

encodeURIComponent(
location.href
);

window.open(

);

/* =====================================================
TOAST
===================================================== */

let toastTimer;

function showToast(message){

const toast=
document.getElementById("toast");

toast.textContent=message;

toast.classList.add("show");

clearTimeout(toastTimer);

toastTimer=
setTimeout(
()=>{
toast.classList.remove("show");
},
1800
);

}


/* =====================================================
LIVE INPUT
===================================================== */

document
.getElementById("nameInput")
.addEventListener(
"input",
function(){

const value=
this.value.trim();

if(value){

generatedStyles=
generateStyles(
value,
currentCategory
);

currentPage=1;

totalPages=
Math.max(
1,
Math.ceil(
generatedStyles.length/
PAGE_SIZE
)
);

renderGenerated();

if(generatedStyles.length){

const preview=
document.getElementById(
"previewText"
);

preview.textContent=
generatedStyles[0];

preview.className=
"previewText f1";

}

}else{

generatedStyles=[];

loadDatabaseNames(
currentCategory
);

const preview=
document.getElementById(
"previewText"
);

preview.textContent=
"꧁༺ NameCraft ༻꧂";

preview.className=
"previewText";

}

}
);


/* =====================================================
ENTER KEY
===================================================== */

document
.getElementById("nameInput")
.addEventListener(
"keydown",
function(event){

if(
event.key==="Enter" &&
!event.shiftKey
){

event.preventDefault();

generate();

}

}
);


/* =====================================================
START
===================================================== */

renderRecent();

loadDatabaseNames(
"Symbolic"
);

</script>
