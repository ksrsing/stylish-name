<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#090d25">
<title>NameCraft - 1500+ Stylish Names</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    color:#fff;
    background:#070a20;
    overflow-x:hidden;
}

/* ===== ANIMATED BACKGROUND ===== */

.bg{
    position:fixed;
    inset:0;
    overflow:hidden;
    z-index:-2;
    background:
        radial-gradient(circle at 20% 20%,#5424a8 0,transparent 30%),
        radial-gradient(circle at 80% 70%,#0066cc 0,transparent 30%),
        linear-gradient(135deg,#050816,#11143b,#080b22);
}

.bg::before{
    content:"";
    position:absolute;
    width:500px;
    height:500px;
    border-radius:50%;
    background:rgba(0,220,255,.16);
    filter:blur(70px);
    animation:orb1 10s infinite alternate ease-in-out;
}

.bg::after{
    content:"";
    position:absolute;
    width:450px;
    height:450px;
    right:-100px;
    bottom:-100px;
    border-radius:50%;
    background:rgba(170,0,255,.18);
    filter:blur(70px);
    animation:orb2 12s infinite alternate ease-in-out;
}

@keyframes orb1{
    0%{transform:translate(-100px,-50px)}
    100%{transform:translate(300px,250px)}
}

@keyframes orb2{
    0%{transform:translate(0,0)}
    100%{transform:translate(-300px,-250px)}
}

.particles{
    position:fixed;
    inset:0;
    z-index:-1;
    pointer-events:none;
}

.particle{
    position:absolute;
    width:4px;
    height:4px;
    border-radius:50%;
    background:#fff;
    box-shadow:0 0 12px #7df9ff;
    animation:float linear infinite;
    opacity:.7;
}

@keyframes float{
    from{
        transform:translateY(110vh);
        opacity:0;
    }
    15%{opacity:.8}
    85%{opacity:.8}
    to{
        transform:translateY(-10vh);
        opacity:0;
    }
}

/* ===== NAVBAR ===== */

nav{
    position:sticky;
    top:0;
    z-index:100;
    padding:15px 5%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:rgba(7,10,32,.72);
    backdrop-filter:blur(15px);
    border-bottom:1px solid rgba(255,255,255,.1);
}

.logo{
    font-size:25px;
    font-weight:bold;
    background:linear-gradient(90deg,#00eaff,#b95cff);
    -webkit-background-clip:text;
    color:transparent;
}

.nav-buttons{
    display:flex;
    gap:8px;
}

.nav-btn{
    border:1px solid rgba(255,255,255,.15);
    background:rgba(255,255,255,.06);
    color:white;
    padding:9px 13px;
    border-radius:10px;
    cursor:pointer;
}

/* ===== HERO ===== */

.hero{
    text-align:center;
    padding:65px 15px 35px;
}

.hero h1{
    font-size:clamp(35px,7vw,70px);
    margin-bottom:15px;
    background:linear-gradient(90deg,#00eaff,#fff,#bd62ff,#00eaff);
    background-size:300%;
    -webkit-background-clip:text;
    color:transparent;
    animation:titleGlow 5s linear infinite;
}

@keyframes titleGlow{
    to{background-position:300%}
}

.hero p{
    color:#c6c9e7;
    font-size:16px;
}

.counter{
    display:inline-block;
    margin-top:18px;
    padding:9px 17px;
    border-radius:30px;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.15);
}

/* ===== SEARCH ===== */

.search-box{
    max-width:850px;
    margin:20px auto;
    padding:12px;
    display:flex;
    gap:10px;
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.13);
    border-radius:18px;
    backdrop-filter:blur(15px);
}

.search-box input{
    flex:1;
    min-width:0;
    border:0;
    outline:0;
    background:transparent;
    color:white;
    padding:13px;
    font-size:16px;
}

.search-box input::placeholder{
    color:#aeb2d0;
}

button{
    border:0;
    cursor:pointer;
    color:white;
    font-weight:bold;
}

.main-btn{
    padding:13px 18px;
    border-radius:12px;
    background:linear-gradient(135deg,#6c35ff,#00bfff);
    box-shadow:0 0 18px rgba(0,191,255,.25);
    transition:.25s;
}

.main-btn:hover{
    transform:translateY(-2px) scale(1.02);
}

/* ===== CATEGORIES ===== */

.section{
    width:92%;
    max-width:1250px;
    margin:35px auto;
}

.section-title{
    text-align:center;
    margin-bottom:18px;
    font-size:25px;
}

.categories{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:10px;
}

.cat{
    padding:13px 8px;
    border-radius:13px;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.1);
    color:#ddd;
    transition:.25s;
}

.cat:hover,
.cat.active{
    background:linear-gradient(135deg,#6337ff,#00aeea);
    transform:translateY(-3px);
}

/* ===== ACTIONS ===== */

.actions{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px;
    margin:25px 0;
}

/* ===== NAME GRID ===== */

.name-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:14px;
}

.card{
    position:relative;
    min-height:145px;
    padding:20px 14px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    border-radius:18px;
    background:rgba(255,255,255,.065);
    border:1px solid rgba(255,255,255,.12);
    backdrop-filter:blur(12px);
    transition:.3s;
    overflow:hidden;
}

.card::before{
    content:"";
    position:absolute;
    width:100px;
    height:100px;
    background:#00d9ff;
    filter:blur(60px);
    opacity:.12;
}

.card:hover{
    transform:translateY(-6px);
    border-color:#6defff;
    box-shadow:0 10px 35px rgba(0,200,255,.16);
}

.name{
    position:relative;
    z-index:2;
    font-size:20px;
    font-weight:bold;
    word-break:break-word;
    margin-bottom:16px;
}

.card-actions{
    position:relative;
    z-index:2;
    display:flex;
    gap:7px;
}

.small-btn{
    padding:7px 10px;
    border-radius:8px;
    background:rgba(255,255,255,.1);
    font-size:12px;
}

.favorite{
    color:#ff4d91;
}

/* ===== FAVORITES ===== */

#favorites{
    display:none;
}

.empty{
    text-align:center;
    color:#aeb2d0;
    padding:25px;
}

/* ===== FOOTER ===== */

footer{
    text-align:center;
    padding:40px 15px;
    color:#9da2c8;
    border-top:1px solid rgba(255,255,255,.08);
    margin-top:50px;
}

/* ===== LIGHT MODE ===== */

body.light{
    color:#101225;
}

body.light .bg{
    background:
        radial-gradient(circle at 20% 20%,#b9eaff,transparent 30%),
        radial-gradient(circle at 80% 70%,#e7c8ff,transparent 30%),
        linear-gradient(135deg,#edf7ff,#fff);
}

body.light nav,
body.light .search-box,
body.light .card,
body.light .cat,
body.light .nav-btn,
body.light .counter{
    background:rgba(255,255,255,.65);
    color:#111;
}

body.light .hero p,
body.light .search-box input,
body.light .search-box input::placeholder,
body.light .empty{
    color:#333;
}

/* ===== RESPONSIVE ===== */

@media(max-width:1000px){
    .name-grid{
        grid-template-columns:repeat(3,1fr);
    }

    .categories{
        grid-template-columns:repeat(3,1fr);
    }
}

@media(max-width:650px){
    nav{
        padding:12px 4%;
    }

    .logo{
        font-size:20px;
    }

    .nav-btn{
        padding:7px 9px;
        font-size:11px;
    }

    .hero{
        padding-top:45px;
    }

    .search-box{
        margin:20px 4%;
    }

    .name-grid{
        grid-template-columns:repeat(2,1fr);
        gap:10px;
    }

    .categories{
        grid-template-columns:repeat(2,1fr);
    }

    .card{
        min-height:135px;
    }

    .name{
        font-size:17px;
    }
}

@media(max-width:400px){
    .name-grid{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<div class="bg"></div>
<div class="particles" id="particles"></div>

<nav>
    <div class="logo">⚡ NameCraft</div>

    <div class="nav-buttons">
        <button class="nav-btn" onclick="scrollToNames()">Names</button>
        <button class="nav-btn" onclick="showFavorites()">❤️ Favorites</button>
        <button class="nav-btn" onclick="toggleTheme()">🌙</button>
    </div>
</nav>

<section class="hero">

    <h1>Stylish Name Generator</h1>

    <p>
        Create 1500+ stylish gaming, Instagram and social media names.
    </p>

    <div class="counter">
        ✨ <span id="totalCounter">1500+</span> Stylish Names
    </div>

    <div class="search-box">

        <input
            id="nameInput"
            type="text"
            placeholder="Enter your name e.g. Rahul..."
            autocomplete="off"
        >

        <button class="main-btn" onclick="generateNames()">
            Generate
        </button>

    </div>

</section>

<section class="section">

    <h2 class="section-title">🔥 Categories</h2>

    <div class="categories">

        <button class="cat active" onclick="setCategory('All',this)">All</button>
        <button class="cat" onclick="setCategory('Gaming',this)">🎮 Gaming</button>
        <button class="cat" onclick="setCategory('Cool',this)">😎 Cool</button>
        <button class="cat" onclick="setCategory('Royal',this)">👑 Royal</button>
        <button class="cat" onclick="setCategory('Fire',this)">🔥 Fire</button>
        <button class="cat" onclick="setCategory('Love',this)">❤️ Love</button>
        <button class="cat" onclick="setCategory('Danger',this)">☠️ Danger</button>
        <button class="cat" onclick="setCategory('Ninja',this)">🥷 Ninja</button>
        <button class="cat" onclick="setCategory('VIP',this)">💎 VIP</button>
        <button class="cat" onclick="setCategory('Attitude',this)">😈 Attitude</button>
        <button class="cat" onclick="setCategory('Animal',this)">🐺 Animal</button>
        <button class="cat" onclick="setCategory('Tech',this)">💻 Tech</button>

    </div>

</section>

<section class="section" id="namesSection">

    <div class="actions">

        <button class="main-btn" onclick="randomName()">
            🎲 Random
        </button>

        <button class="main-btn" onclick="generateNames()">
            🔄 Generate Again
        </button>

        <button class="main-btn" onclick="showFavorites()">
            ❤️ Favorites
        </button>

    </div>

    <h2 class="section-title" id="resultTitle">
        ✨ 1500+ Stylish Names
    </h2>

    <div class="name-grid" id="nameGrid"></div>

</section>

<section class="section" id="favorites">

    <h2 class="section-title">❤️ Your Favorites</h2>

    <div class="name-grid" id="favoriteGrid"></div>

</section>

<footer>
    © 2026 NameCraft — Stylish Name Generator
</footer>

<script>

/* ==========================================
   BASE NAMES
========================================== */



const baseNames = [

"Rahul","Sonu","Monu","Rohit","Aman",
"Ankit","Vikas","Vivek","Arjun","Karan",
"Akash","Ravi","Raj","Raja","Aryan",
"Aditya","Yash","Dev","Suraj","Sameer",
"Sumit","Sahil","Nikhil","Nitin","Varun",
"Varun","Abhishek","Ashish","Mohit","Manish",
"Deepak","Pankaj","Prakash","Shubham","Shivam",
"Harsh","Ayush","Rajat","Rishabh","Kunal",
"Prince","King","Boss","Legend","Hunter",
"Sniper","Warrior","Ninja","Shadow","Ghost",
"Dragon","Tiger","Wolf","Lion","Falcon",
"Rocky","Lucky","Danger","Killer","Beast",
"Devil","Angel","Fire","Storm","Thunder",
"Venom","Blaze","Fury","Rider","Gamer",
"Pro","Master","Champion","Hero","Heroic",
"Alpha","Omega","Titan","Phoenix","Demon",
"God","Kingdom","Royal","Star","Moon",
"Night","Dark","Black","White","Red",
"Blue","Cyber","Pixel","Hacker","Coder",
"Matrix","Tech","Bot","Byte","Nova",
"Galaxy","Cosmic","Infinity","Eagle","Cobra",
"Panther","Leopard","Bear","Fox","Hawk"

];
    
        
/* ==========================================
   500+ STYLE PATTERNS
========================================== */

const styles = [

"꧁༺ {NAME} ༻꧂",
"亗 {NAME} 亗",
"『{NAME}』",
"乂 {NAME} 乂",
"メ {NAME} メ",
"么 {NAME} 么",
"ツ {NAME} ツ",
"々 {NAME} 々",
"彡 {NAME} 彡",
"★ {NAME} ★",
"☆ {NAME} ☆",
"✦ {NAME} ✦",
"✧ {NAME} ✧",
"⚡ {NAME} ⚡",
"☠ {NAME} ☠",
"☯ {NAME} ☯",
"♛ {NAME} ♛",
"♕ {NAME} ♕",
"♚ {NAME} ♚",
"♔ {NAME} ♔",
"꧁ {NAME} ꧂",
"༒ {NAME} ༒",
"༺ {NAME} ༻",
"『亗』{NAME}『亗』",
"×͜× {NAME} ×͜×",
"乂༺{NAME}༻乂",
"★彡 {NAME} 彡★",
"꧁༒{NAME}༒꧂",
"『★』{NAME}『★』",
"◥꧁ {NAME} ꧂◤",
"♠ {NAME} ♠",
"♥ {NAME} ♥",
"♦ {NAME} ♦",
"♣ {NAME} ♣",
"☬ {NAME} ☬",
"☠︎ {NAME} ☠︎",
"⚔ {NAME} ⚔",
"⚜ {NAME} ⚜",
"♨ {NAME} ♨",
"☾ {NAME} ☽",
"☀ {NAME} ☀",
"☁ {NAME} ☁",
"❖ {NAME} ❖",
"◆ {NAME} ◆",
"◇ {NAME} ◇",
"◈ {NAME} ◈",
"⬢ {NAME} ⬢",
"⬡ {NAME} ⬡",
"✪ {NAME} ✪",
"✯ {NAME} ✯",
"✰ {NAME} ✰",
"✵ {NAME} ✵",
"✺ {NAME} ✺",
"✹ {NAME} ✹",
"❂ {NAME} ❂",
"❀ {NAME} ❀",
"✿ {NAME} ✿",
"❥ {NAME} ❥",
"ღ {NAME} ღ",
"♡ {NAME} ♡",
"♥︎ {NAME} ♥︎",
"∞ {NAME} ∞",
"♾ {NAME} ♾",
"☮ {NAME} ☮",
"☪ {NAME} ☪",
"☘ {NAME} ☘",
"☄ {NAME} ☄",
"☣ {NAME} ☣",
"☢ {NAME} ☢",
"⚡︎ {NAME} ⚡︎",
"⫷ {NAME} ⫸",
"⟦ {NAME} ⟧",
"⟨ {NAME} ⟩",
"〈 {NAME} 〉",
"《 {NAME} 》",
"【 {NAME} 】",
"〖 {NAME} 〗",
"〘 {NAME} 〙",
"〚 {NAME} 〛",
"〔 {NAME} 〕",
"﹝ {NAME} ﹞",
"⟬ {NAME} ⟭",
"⟪ {NAME} ⟫",
"⦗ {NAME} ⦘",
"⧼ {NAME} ⧽"

];

/* ==========================================
   FONT EFFECTS
========================================== */

const fonts = [

name => name.toUpperCase(),
name => name.toLowerCase(),
name => name.split("").join(" "),
name => name.split("").join("•"),
name => name.split("").join("・"),
name => name.split("").join("✦"),
name => name.split("").join("★"),
name => name.split("").join("♡"),
name => name.split("").join("⚡"),
name => "𝙎𝙩𝙮𝙡𝙚 " + name,
name => "メ " + name,
name => "亗 " + name,
name => "乂 " + name,
name => "〆" + name,
name => "ツ" + name

];

/* ==========================================
   GENERATE 1500+ UNIQUE NAMES
========================================== */

let allNames = [];
let currentCategory = "All";
let favorites = JSON.parse(localStorage.getItem("namecraftFavorites") || "[]");

function buildNames(){

    allNames = [];

    let counter = 0;

    while(allNames.length < 1800){

        const base = baseNames[counter % baseNames.length];

        const style = styles[counter % styles.length];

        const font = fonts[counter % fonts.length];

        let number = "";

        if(counter % 4 === 0){
            number = Math.floor(counter / 4) + 1;
        }

        let name = base + number;

        name = font(name);

        name = style.replace("{NAME}",name);

        if(!allNames.includes(name)){
            allNames.push(name);
        }

        counter++;
    }

    document.getElementById("totalCounter").textContent =
        allNames.length + "+";
}

/* ==========================================
   DISPLAY
========================================== */

function displayNames(list = allNames){

    const grid = document.getElementById("nameGrid");

    grid.innerHTML = "";

    list.slice(0,150).forEach((name,index)=>{

        const card = document.createElement("div");

        card.className = "card";

        const isFav = favorites.includes(name);

        card.innerHTML = `

            <div class="name">${escapeHTML(name)}</div>

            <div class="card-actions">

                <button class="small-btn"
                    onclick="copyName(${index},this)">
                    📋 Copy
                </button>

                <button class="small-btn favorite"
                    onclick="toggleFavorite(${index})">
                    ${isFav ? "❤️ Saved" : "♡ Favorite"}
                </button>

                <button class="small-btn"
                    onclick="shareName(${index})">
                    🔗 Share
                </button>

            </div>
        `;

        grid.appendChild(card);

    });

    document.getElementById("resultTitle").textContent =
        "✨ " + Math.min(list.length,150) + " Stylish Names";

    window.currentDisplayedNames = list.slice(0,150);
}

/* ==========================================
   GENERATE CUSTOM NAMES
========================================== */

function generateNames(){

    const input =
        document.getElementById("nameInput").value.trim();

    if(!input){

        displayNames(allNames);

        return;
    }

    const generated = [];

    styles.forEach((style,si)=>{

        fonts.forEach((font,fi)=>{

            if(generated.length >= 150) return;

            let name = input;

            name = font(name);

            name = style.replace("{NAME}",name);

            generated.push(name);

        });

    });

    displayNames(generated);

    scrollToNames();
}

/* ==========================================
   SEARCH
========================================== */

document
.getElementById("nameInput")
.addEventListener("input",function(){

    const q = this.value.toLowerCase().trim();

    if(!q){

        displayNames(allNames);

        return;
    }

    const filtered = allNames.filter(name =>
        name.toLowerCase().includes(q)
    );

    displayNames(filtered);

});

/* ==========================================
   COPY
========================================== */

function copyName(index,button){

    const name =
        window.currentDisplayedNames[index];

    navigator.clipboard.writeText(name);

    const old = button.textContent;

    button.textContent = "✅ Copied";

    setTimeout(()=>{
        button.textContent = old;
    },1200);
}

/* ==========================================
   FAVORITES
========================================== */

function toggleFavorite(index){

    const name =
        window.currentDisplayedNames[index];

    if(favorites.includes(name)){

        favorites =
            favorites.filter(x => x !== name);

    }else{

        favorites.push(name);
    }

    localStorage.setItem(
        "namecraftFavorites",
        JSON.stringify(favorites)
    );

    displayNames(window.currentDisplayedNames);
}

/* ==========================================
   FAVORITES PAGE
========================================== */

function showFavorites(){

    const section =
        document.getElementById("favorites");

    const grid =
        document.getElementById("favoriteGrid");

    section.style.display = "block";

    grid.innerHTML = "";

    if(favorites.length === 0){

        grid.innerHTML =
            `<div class="empty">
                ❤️ अभी कोई favorite name नहीं है.
            </div>`;

        section.scrollIntoView({
            behavior:"smooth"
        });

        return;
    }

    favorites.forEach((name,index)=>{

        const card =
            document.createElement("div");

        card.className = "card";

        card.innerHTML = `

            <div class="name">
                ${escapeHTML(name)}
            </div>

            <div class="card-actions">

                <button class="small-btn"
                    onclick="navigator.clipboard.writeText(${JSON.stringify(name)})">
                    📋 Copy
                </button>

                <button class="small-btn favorite"
                    onclick="removeFavorite(${index})">
                    🗑 Remove
                </button>

            </div>
        `;

        grid.appendChild(card);
    });

    section.scrollIntoView({
        behavior:"smooth"
    });
}

function removeFavorite(index){

    favorites.splice(index,1);

    localStorage.setItem(
        "namecraftFavorites",
        JSON.stringify(favorites)
    );

    showFavorites();
}

/* ==========================================
   RANDOM
========================================== */

function randomName(){

    const random =
        allNames[Math.floor(Math.random()*allNames.length)];

    document.getElementById("nameInput").value = random;

    displayNames([random]);

    scrollToNames();
}

/* ==========================================
   CATEGORY
========================================== */

function setCategory(category,button){

    currentCategory = category;

    document
    .querySelectorAll(".cat")
    .forEach(btn =>
        btn.classList.remove("active")
    );

    button.classList.add("active");

    if(category === "All"){

        displayNames(allNames);

        return;
    }

    const categoryWords = {

        Gaming:["gamer","pro","warrior","hunter","sniper","ninja","killer"],

        Cool:["cool","shadow","ghost","dark","star"],

        Royal:["king","queen","royal","prince","boss"],

        Fire:["fire","blaze","flame","fury","burn"],

        Love:["angel","love","heart","rose"],

        Danger:["danger","killer","devil","venom","beast"],

        Ninja:["ninja","shadow","ghost"],

        VIP:["vip","king","royal","boss"],

        Attitude:["boss","devil","alpha","king"],

        Animal:["wolf","tiger","lion","fox","eagle","cobra"],

        Tech:["tech","cyber","pixel","coder","hacker","byte"]

    };

    const words =
        categoryWords[category] || [];

    const filtered =
        allNames.filter(name =>
            words.some(word =>
                name.toLowerCase().includes(word)
            )
        );

    displayNames(
        filtered.length ? filtered : allNames
    );
}


/* ==========================================
   SHARE
========================================== */

async function shareName(index){

    const name = window.currentDisplayedNames[index];

    if(!name){
        return;
    }

    // Android App
    if(window.AndroidShare){
        window.AndroidShare.shareText(name);
        return;
    }

    // Browser
    if(navigator.share){
        try{

            await navigator.share({
                title: "NameCraft Stylish Name",
                text: name,
                url: window.location.href
            });

        }catch(error){

            console.log("Share cancelled");

        }

        return;
    }

    // Fallback
    try{

        await navigator.clipboard.writeText(name);
        alert("Name copied!");

    }catch(error){

        alert("Unable to share");

    }
}
    
/* ==========================================
   THEME
========================================== */

function toggleTheme(){

    document.body.classList.toggle("light");

    localStorage.setItem(
        "namecraftTheme",
        document.body.classList.contains("light")
        ? "light"
        : "dark"
    );
}

if(localStorage.getItem("namecraftTheme")==="light"){
    document.body.classList.add("light");
}

/* ==========================================
   PARTICLES
========================================== */

function createParticles(){

    const container =
        document.getElementById("particles");

    for(let i=0;i<45;i++){

        const p =
            document.createElement("div");

        p.className = "particle";

        p.style.left =
            Math.random()*100 + "%";

        p.style.animationDuration =
            (5 + Math.random()*12) + "s";

        p.style.animationDelay =
            (-Math.random()*15) + "s";

        const size =
            2 + Math.random()*4;

        p.style.width =
            size + "px";

        p.style.height =
            size + "px";

        container.appendChild(p);
    }
}

/* ==========================================
   SECURITY HTML
========================================== */

function escapeHTML(str){

    return str
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}
