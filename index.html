<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#070b20">

<title>NameCraft - Stylish Name Generator</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:
    linear-gradient(135deg,#070b20,#11194a,#080b25);
    color:white;
    min-height:100vh;
}

header{
    position:sticky;
    top:0;
    z-index:1000;
    background:rgba(5,8,25,.95);
    backdrop-filter:blur(10px);
    border-bottom:1px solid rgba(255,255,255,.1);
}

.nav{
    max-width:1200px;
    margin:auto;
    padding:16px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:25px;
    font-weight:bold;
    color:#7c7cff;
}

.nav a{
    color:white;
    text-decoration:none;
    margin-left:18px;
    font-size:14px;
}

.container{
    width:95%;
    max-width:1200px;
    margin:auto;
}

.hero{
    text-align:center;
    padding:55px 15px 35px;
}

.hero h1{
    font-size:42px;
    margin-bottom:12px;
}

.hero h1 span{
    color:#7c7cff;
}

.hero p{
    color:#bfc4e8;
    margin-bottom:25px;
}

.searchBox{
    max-width:700px;
    margin:auto;
    display:flex;
    gap:10px;
}

.searchBox input{
    flex:1;
    padding:16px;
    border:none;
    border-radius:12px;
    outline:none;
    background:#171d45;
    color:white;
    font-size:16px;
}

button{
    border:none;
    cursor:pointer;
    border-radius:10px;
    padding:13px 18px;
    font-weight:bold;
}

.generateBtn{
    background:#6c63ff;
    color:white;
}

.randomBtn{
    background:#00bcd4;
    color:white;
}

.categories{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:10px;
    margin:20px 0;
}

.category{
    background:#141a3d;
    color:white;
    border:1px solid rgba(255,255,255,.08);
}

.category.active{
    background:#6c63ff;
}

.toolbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:25px 0 15px;
    gap:10px;
}

.toolbar h2{
    font-size:22px;
}

.count{
    color:#aeb5df;
    font-size:14px;
}

.status{
    background:#111735;
    border:1px solid rgba(255,255,255,.1);
    padding:12px;
    border-radius:10px;
    margin-bottom:15px;
    color:#bfc4e8;
}

.grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:14px;
}

.card{
    background:
    linear-gradient(145deg,#151c45,#101533);
    border:1px solid rgba(255,255,255,.08);
    border-radius:14px;
    padding:18px;
    min-height:130px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    box-shadow:0 8px 25px rgba(0,0,0,.2);
}

.name{
    font-size:20px;
    font-weight:bold;
    word-break:break-word;
    text-align:center;
    padding:10px 5px;
}

.cardButtons{
    display:flex;
    gap:8px;
}

.copyBtn{
    flex:1;
    background:#252d62;
    color:white;
}

.favBtn{
    width:48px;
    background:#252d62;
    color:white;
    font-size:18px;
}

.favBtn.saved{
    background:#ff3d71;
}

.pagination{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:8px;
    margin:30px 0 50px;
    flex-wrap:wrap;
}

.pageBtn{
    background:#171e48;
    color:white;
}

.pageBtn.active{
    background:#6c63ff;
}

footer{
    text-align:center;
    padding:30px 15px;
    color:#8991bd;
    border-top:1px solid rgba(255,255,255,.08);
}

.message{
    text-align:center;
    padding:50px 20px;
    color:#aeb5df;
}

.error{
    color:#ff6b7d;
}

@media(max-width:900px){

    .grid{
        grid-template-columns:repeat(3,1fr);
    }

    .categories{
        grid-template-columns:repeat(4,1fr);
    }

}

@media(max-width:650px){

    .hero h1{
        font-size:31px;
    }

    .searchBox{
        flex-direction:column;
    }

    .categories{
        grid-template-columns:repeat(2,1fr);
    }

    .grid{
        grid-template-columns:repeat(2,1fr);
    }

    .nav{
        padding:13px;
    }

    .nav a{
        margin-left:8px;
        font-size:12px;
    }

}

@media(max-width:420px){

    .grid{
        grid-template-columns:1fr;
    }

}

</style>

</head>

<body>

<header>

<div class="nav">

<div class="logo">
NameCraft
</div>

<div>
<a href="#">Home</a>
<a href="#names">Names</a>
<a href="#favorites">Favorites</a>
</div>

</div>

</header>


<main class="container">

<section class="hero">

<h1>
Create <span>Stylish Names</span>
</h1>

<p>
Generate stylish gaming, cool, royal, love and aesthetic names.
</p>

<div class="searchBox">

<input
type="text"
id="nameInput"
placeholder="Enter your name e.g. Rahul"
autocomplete="off">

<button
class="generateBtn"
onclick="generateNames()">
Generate
</button>

<button
class="randomBtn"
onclick="randomName()">
Random
</button>

</div>

</section>


<div class="categories">

<button
class="category active"
onclick="setCategory('All',this)">
All
</button>

<button
class="category"
onclick="setCategory('Gaming',this)">
Gaming
</button>

<button
class="category"
onclick="setCategory('Cool',this)">
Cool
</button>

<button
class="category"
onclick="setCategory('Royal',this)">
Royal
</button>

<button
class="category"
onclick="setCategory('Love',this)">
Love
</button>

<button
class="category"
onclick="setCategory('Aesthetic',this)">
Aesthetic
</button>

<button
class="category"
onclick="setCategory('Neon',this)">
Neon
</button>

<button
class="category"
onclick="setCategory('Unicode',this)">
Unicode
</button>

<button
class="category"
onclick="setCategory('Danger',this)">
Danger
</button>

<button
class="category"
onclick="setCategory('Minimal',this)">
Minimal
</button>

</div>


<div id="names">

<div class="toolbar">

<h2>
Stylish Names
</h2>

<div class="count" id="nameCount">
Loading...
</div>

</div>


<div
class="status"
id="status">
Connecting to online names...
</div>


<div
class="grid"
id="nameGrid">
</div>


<div
class="pagination"
id="pagination">
</div>

</div>


<section id="favorites">

<div class="toolbar">

<h2>
❤️ Favorites
</h2>

<div
class="count"
id="favoriteCount">
0 saved
</div>

</div>

<div
class="grid"
id="favoriteGrid">

<div class="message">
Your favorite names will appear here.
</div>

</div>

</section>

</main>


<footer>

© 2026 NameCraft | Stylish Name Generator

</footer>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://ujpzkpeslemcuizylymi.supabase.co";

const SUPABASE_KEY =
"sb_publishable_oT5xR6-pXK9vM9jlxvhydA_CgZs1qAB";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================================
   VARIABLES
========================================= */

let onlineRecords = [];

let allNames = [];

let displayedNames = [];

let favorites = [];

let page = 1;

const perPage = 100;


/* =========================================
   LOAD FAVORITES
========================================= */

try{

    favorites =
    JSON.parse(
        localStorage.getItem("namecraftFavorites")
    ) || [];

}catch(e){

    favorites = [];

}


/* =========================================
   LOAD NAMES FROM SUPABASE
========================================= */

async function loadNamesFromSupabase(){

    const status =
    document.getElementById("status");

    status.innerText =
    "Loading names from Supabase...";


    let allOnline = [];

    let from = 0;

    const batchSize = 1000;


    while(true){

        const {
            data,
            error
        } =
        await supabaseClient
        .from("names")
        .select("id,name,category")
        .order("id",{ascending:true})
        .range(
            from,
            from + batchSize - 1
        );


        if(error){

            console.error(
                "SUPABASE ERROR:",
                error
            );

            status.innerHTML =
            '<span class="error">' +
            "Supabase Error: " +
            error.message +
            "</span>";

            return;
        }


        if(
            !data ||
            data.length === 0
        ){

            break;
        }


        allOnline =
        allOnline.concat(data);


        console.log(
            "Loaded:",
            allOnline.length
        );


        if(
            data.length < batchSize
        ){

            break;
        }


        from += batchSize;

    }


    onlineRecords =
    allOnline;


    if(
        onlineRecords.length > 0
    ){

        allNames =
        onlineRecords.map(
            row => row.name
        );


        displayedNames =
        [...allNames];


        page = 1;


        status.innerText =
        "✅ Online names connected successfully.";


        render();


        console.log(
            "TOTAL ONLINE NAMES:",
            onlineRecords.length
        );

    }else{

        status.innerHTML =
        '<span class="error">' +
        "Supabase connected, but no names found." +
        "</span>";

    }

}


/* =========================================
   LOCAL FALLBACK NAMES
========================================= */

function createDifferentNames(){

    const names = [

        "Rahul",
        "Sonu",
        "Monu",
        "Ankit",
        "Rohit",
        "Aman",
        "Aryan",
        "King",
        "Dev",
        "Raj",
        "Ravi",
        "Vicky",
        "Karan",
        "Arjun",
        "Shiv",
        "Aditya",
        "Vijay",
        "Prince",
        "Rocky",
        "Suraj"

    ];


    const styles = [

        "꧁༺ NAME ༻꧂",

        "亗 NAME 亗",

        "『 NAME 』",

        "乂 NAME 乂",

        "★ NAME ★",

        "么 NAME 么",

        "彡 NAME 彡",

        "ツ NAME ツ",

        "⚡ NAME ⚡",

        "♛ NAME ♛",

        "☠ NAME ☠",

        "『★』NAME『★』",

        "꧁ NAME ꧂",

        "༺ NAME ༻",

        "★彡 NAME 彡★",

        "×͜× NAME",

        "々 NAME 々",

        "メ NAME メ",

        "〆 NAME 〆",

        "ᎠᎬᏙᏆᏞ NAME"

    ];


    let result = [];


    names.forEach(base => {

        styles.forEach(style => {

            result.push(
                style.replace(
                    "NAME",
                    base
                )
            );

        });

    });


    return result;

}


/* =========================================
   GENERATE USER NAMES
========================================= */

function createUserNames(base){

    if(!base){
        return [];
    }


    const styles = [

        "꧁༺ NAME ༻꧂",

        "亗 NAME 亗",

        "『 NAME 』",

        "乂 NAME 乂",

        "★ NAME ★",

        "么 NAME 么",

        "彡 NAME 彡",

        "ツ NAME ツ",

        "⚡ NAME ⚡",

        "♛ NAME ♛",

        "☠ NAME ☠",

        "꧁ NAME ꧂",

        "༺ NAME ༻",

        "★彡 NAME 彡★",

        "々 NAME 々",

        "メ NAME メ",

        "〆 NAME 〆",

        "×͜× NAME",

        "『★』NAME『★』",

        "亗『NAME』亗",

        "☬ NAME ☬",

        "♚ NAME ♚",

        "♕ NAME ♕",

        "⚔ NAME ⚔",

        "🔥 NAME 🔥",

        "💀 NAME 💀",

        "❤️ NAME ❤️",

        "💎 NAME 💎",

        "👑 NAME 👑",

        "★ NAME ★",

        "『ツ』NAME",

        "亗 NAME ツ",

        "꧁ NAME 亗",

        "亗 NAME ꧂"

    ];


    let result = [];


    for(let i = 0; i < 20; i++){

        styles.forEach(style => {

            let n =
            style.replace(
                "NAME",
                base
            );

            if(i > 0){

                n =
                n.replace(
                    base,
                    base + i
                );

            }

            result.push(n);

        });

    }


    return result;

}


/* =========================================
   GENERATE BUTTON
========================================= */

function generateNames(){

    const input =
    document.getElementById(
        "nameInput"
    );


    const base =
    input.value.trim();


    if(!base){

        alert(
            "Pehle apna name enter karo."
        );

        input.focus();

        return;
    }


    displayedNames =
    createUserNames(base);


    page = 1;


    document.getElementById(
        "status"
    ).innerText =
    "Showing stylish names for: " +
    base;


    render();


    document
    .getElementById("names")
    .scrollIntoView({
        behavior:"smooth"
    });

}


/* =========================================
   RANDOM NAME
========================================= */

function randomName(){

    if(
        !displayedNames.length
    ){

        alert(
            "Names abhi load nahi hue."
        );

        return;
    }


    const random =
    displayedNames[
        Math.floor(
            Math.random() *
            displayedNames.length
        )
    ];


    document.getElementById(
        "nameInput"
    ).value = random;


    alert(
        "Random Name:\n\n" +
        random
    );

}


/* =========================================
   CATEGORY
========================================= */

function setCategory(
    category,
    button
){

    document
    .querySelectorAll(
        ".category"
    )
    .forEach(btn => {

        btn.classList.remove(
            "active"
        );

    });


    if(button){

        button.classList.add(
            "active"
        );

    }


    if(category === "All"){

        displayedNames =
        [...allNames];

    }else{

        displayedNames =
        onlineRecords
        .filter(row => {

            return row.category &&
            row.category
            .toLowerCase() ===
            category.toLowerCase();

        })
        .map(
            row => row.name
        );

    }


    page = 1;


    document.getElementById(
        "status"
    ).innerText =
    category === "All"
    ?
    "Showing all online names."
    :
    "Showing " +
    category +
    " names.";


    render();

}


/* =========================================
   RENDER
========================================= */

function render(){

    const grid =
    document.getElementById(
        "nameGrid"
    );


    const count =
    document.getElementById(
        "nameCount"
    );


    const pagination =
    document.getElementById(
        "pagination"
    );


    grid.innerHTML = "";


    if(
        !displayedNames ||
        displayedNames.length === 0
    ){

        grid.innerHTML =
        `
        <div class="message">
        No names found.
        </div>
        `;

        count.innerText =
        "0 names";

        pagination.innerHTML = "";

        return;
    }


    count.innerText =
    displayedNames.length +
    " names";


    const totalPages =
    Math.ceil(
        displayedNames.length /
        perPage
    );


    if(page > totalPages){

        page = totalPages;

    }


    const start =
    (page - 1) *
    perPage;


    const end =
    start + perPage;


    const currentNames =
    displayedNames.slice(
        start,
        end
    );


    currentNames.forEach(
        name => {

            grid.appendChild(
                createCard(name)
            );

        }
    );


    renderPagination(
        totalPages
    );

}


/* =========================================
   CREATE CARD
========================================= */

function createCard(name){

    const card =
    document.createElement(
        "div"
    );


    card.className =
    "card";


    const nameDiv =
    document.createElement(
        "div"
    );


    nameDiv.className =
    "name";


    nameDiv.innerText =
    name;


    const buttons =
    document.createElement(
        "div"
    );


    buttons.className =
    "cardButtons";


    const copy =
    document.createElement(
        "button"
    );


    copy.className =
    "copyBtn";


    copy.innerText =
    "📋 Copy";


    copy.onclick = function(){

        copyName(name);

    };


    const fav =
    document.createElement(
        "button"
    );


    fav.className =
    "favBtn";


    fav.innerText =
    favorites.includes(name)
    ? "❤️"
    : "♡";


    if(
        favorites.includes(name)
    ){

        fav.classList.add(
            "saved"
        );

    }


    fav.onclick = function(){

        toggleFavorite(
            name,
            fav
        );

    };


    buttons.appendChild(copy);

    buttons.appendChild(fav);


    card.appendChild(nameDiv);

    card.appendChild(buttons);


    return card;

}


/* =========================================
   COPY
========================================= */

function copyName(name){

    if(
        navigator.clipboard
    ){

        navigator.clipboard
        .writeText(name)
        .then(() => {

            alert(
                "Copied:\n\n" +
                name
            );

        })
        .catch(() => {

            fallbackCopy(name);

        });

    }else{

        fallbackCopy(name);

    }

}


function fallbackCopy(text){

    const textarea =
    document.createElement(
        "textarea"
    );


    textarea.value = text;


    document.body.appendChild(
        textarea
    );


    textarea.select();


    try{

        document.execCommand(
            "copy"
        );

        alert(
            "Copied:\n\n" +
            text
        );

    }catch(e){

        alert(
            "Copy failed."
        );

    }


    textarea.remove();

}


/* =========================================
   FAVORITE
========================================= */

function toggleFavorite(
    name,
    button
){

    const index =
    favorites.indexOf(name);


    if(index === -1){

        favorites.push(name);

        button.innerText =
        "❤️";

        button.classList.add(
            "saved"
        );

    }else{

        favorites.splice(
            index,
            1
        );

        button.innerText =
        "♡";

        button.classList.remove(
            "saved"
        );

    }


    localStorage.setItem(
        "namecraftFavorites",
        JSON.stringify(
            favorites
        )
    );


    renderFavorites();

}


/* =========================================
   FAVORITES
========================================= */

function renderFavorites(){

    const grid =
    document.getElementById(
        "favoriteGrid"
    );


    const count =
    document.getElementById(
        "favoriteCount"
    );


    count.innerText =
    favorites.length +
    " saved";


    grid.innerHTML = "";


    if(
        favorites.length === 0
    ){

        grid.innerHTML =
        `
        <div class="message">
        Your favorite names will appear here.
        </div>
        `;

        return;

    }


    favorites.forEach(
        name => {

            grid.appendChild(
                createCard(name)
            );

        }
    );

}


/* =========================================
   PAGINATION
========================================= */

function renderPagination(
    totalPages
){

    const pagination =
    document.getElementById(
        "pagination"
    );


    pagination.innerHTML = "";


    if(totalPages <= 1){

        return;

    }


    const previous =
    document.createElement(
        "button"
    );


    previous.className =
    "pageBtn";


    previous.innerText =
    "← Previous";


    previous.disabled =
    page === 1;


    previous.onclick =
    function(){

        if(page > 1){

            page--;

            render();

            window.scrollTo({
                top:400,
                behavior:"smooth"
            });

        }

    };


    pagination.appendChild(
        previous
    );


    let start =
    Math.max(
        1,
        page - 2
    );


    let end =
    Math.min(
        totalPages,
        page + 2
    );


    for(
        let i = start;
        i <= end;
        i++
    ){

        const btn =
        document.createElement(
            "button"
        );


        btn.className =
        "pageBtn";


        if(i === page){

            btn.classList.add(
                "active"
            );

        }


        btn.innerText =
        i;


        btn.onclick =
        function(){

            page = i;

            render();

            window.scrollTo({
                top:400,
                behavior:"smooth"
            });

        };


        pagination.appendChild(
            btn
        );

    }


    const next =
    document.createElement(
        "button"
    );


    next.className =
    "pageBtn";


    next.innerText =
    "Next →";


    next.disabled =
    page === totalPages;


    next.onclick =
    function(){

        if(
            page < totalPages
        ){

            page++;

            render();

            window.scrollTo({
                top:400,
                behavior:"smooth"
            });

        }

    };


    pagination.appendChild(
        next
    );

}


/* =========================================
   START
========================================= */

async function startNameCraft(){

    console.log(
        "NameCraft started"
    );


    // Pehle local names dikhao
    allNames =
    createDifferentNames();


    displayedNames =
    [...allNames];


    page = 1;


    render();


    renderFavorites();


    // Ab Supabase se 9000 online names
    await loadNamesFromSupabase();

}


startNameCraft();

</script>

</body>
</html>
