*{

    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f4f5f8;
    color:#444;
    min-height:100vh;
}

/* HEADER */

.header{
    background:linear-gradient(100deg,#27d8d0,#4034b8,#ef008f);
    height:128px;
    display:flex;
    justify-content:center;
    align-items:center;
    border-bottom:4px solid #111;
    overflow:hidden;
}

.logo{
    color:white;
    font-size:52px;
    font-family:cursive;
    font-weight:bold;
    text-shadow:
        0 3px 3px rgba(0,0,0,.3),
        0 0 10px rgba(255,255,255,.5);
}

/* MAIN */

.container{
    width:100%;
    max-width:850px;
    margin:auto;
    padding:10px 8px 40px;
}

/* INPUT */

.inputBox{
    position:relative;
    margin-top:0;
}

#nameInput{
    width:100%;
    height:138px;
    resize:vertical;
    border:3px solid #111;
    border-radius:20px;
    background:#fff;
    padding:24px 55px 20px 55px;
    font-size:29px;
    color:#333;
    outline:none;
    box-shadow:0 5px 15px rgba(0,0,0,.08);
}

#nameInput::placeholder{
    color:#cbd0d8;
}

.clearBtn{
    position:absolute;
    right:25px;
    top:25px;
    border:0;
    background:none;
    color:#c40000;
    font-size:32px;
    cursor:pointer;
}

/* SHARE */

.share{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    margin:20px 0 25px;
    flex-wrap:wrap;
}

.shareText{
    font-size:18px;
    color:#888;
    margin-right:4px;
}

.shareBtn{
    width:48px;
    height:48px;
    border-radius:50%;
    border:0;
    color:white;
    font-size:21px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
}

.facebook{background:#1264a3;}
.twitter{background:#6d20a8;}
.email{background:#682099;}
.whatsapp{background:#6d20a8;}
.telegram{background:#63209a;}

.shareBtn:active{
    transform:scale(.92);
}

/* PREVIEW */

.preview{
    min-height:105px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:15px;
    font-size:28px;
    color:#888;
    overflow:hidden;
}

.previewText{
    word-break:break-word;
}

/* CATEGORY */

.categoriesWrap{
    margin-top:20px;
    overflow:hidden;
}

.categories{
    display:flex;
    gap:7px;
    overflow-x:auto;
    padding:4px 0 12px;
    scrollbar-width:none;
}

.categories::-webkit-scrollbar{
    display:none;
}

.catBtn{
    flex:0 0 auto;
    padding:15px 25px;
    border:0;
    border-radius:17px;
    background:#c9d5e8;
    color:#62666c;
    font-size:20px;
    cursor:pointer;
    white-space:nowrap;
}

.catBtn.active{
    background:#6d20a8;
    color:white;
}

/* SECTION TITLE */

.sectionTitle{
    font-size:30px;
    margin:15px 10px;
    color:#777;
    font-weight:400;
}

/* RESULTS */

.results{
    display:flex;
    flex-direction:column;
    gap:14px;
}

.nameCard{
    min-height:82px;
    background:white;
    border-radius:18px;
    display:flex;
    align-items:stretch;
    overflow:hidden;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.nameContent{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:12px 8px;
    font-size:27px;
    color:#151515;
    word-break:break-word;
    line-height:1.25;
}

.cardActions{
    width:105px;
    display:flex;
    flex-direction:column;
}

.actionBtn{
    flex:1;
    border:0;
    color:white;
    background:#7020a5;
    cursor:pointer;
    font-size:16px;
    font-weight:bold;
}

.actionBtn:hover{
    background:#58127f;
}

.copyBtn{
    border-bottom:1px solid rgba(255,255,255,.2);
}

/* LOADING */

.loading{
    text-align:center;
    padding:35px 10px;
    color:#888;
    font-size:18px;
}

/* RECENT */

.recent{
    margin-top:35px;
}

.recentList{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.recentItem{
    background:#fff;
    border-radius:15px;
    padding:16px;
    text-align:center;
    font-size:21px;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
    cursor:pointer;
}

/* PAGINATION */

.pagination{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:15px;
    margin:25px 0;
}

.pageBtn{
    border:0;
    background:#7020a5;
    color:white;
    padding:11px 18px;
    border-radius:10px;
    cursor:pointer;
    font-size:16px;
}

.pageBtn:disabled{
    opacity:.4;
}

.pageInfo{
    color:#777;
}

/* TOAST */

.toast{
    position:fixed;
    left:50%;
    bottom:25px;
    transform:translateX(-50%) translateY(80px);
    background:#222;
    color:white;
    padding:13px 22px;
    border-radius:30px;
    opacity:0;
    transition:.3s;
    z-index:9999;
}

.toast.show{
    transform:translateX(-50%) translateY(0);
    opacity:1;
}

/* FOOTER */

footer{
    margin-top:50px;
    background:#29204a;
    color:#ddd;
    text-align:center;
    padding:30px 15px;
    line-height:1.8;
}

footer strong{
    color:white;

/* DESKTOP */

@media(min-width:700px){

    .header{

    .logo{

    }

    #nameInput{

    }

    .nameContent{

    }

        width:88px;
    }

    .actionBtn{
        font-size:13px;
    }

/* =========================================================
   UNICODE FUNCTIONS
========================================================= */

function convertText(text,map){

    return [...text]
        .map(char => map[char] || char)
        .join("");

}


function boldText(text){

    return convertText(text,boldMap);

}


function italicText(text){

    return convertText(text,italicMap);

}


function smallText(text){

    return convertText(
        text.toLowerCase(),
        smallMap
    );

}


function underlineText(text){

    return [...text]
        .map(c => c + "\u0332")
        .join("");

}


function strikeText(text){

    return [...text]
        .map(c => c + "\u0336")
        .join("");

}


function spacedText(text){

    return [...text].join(" ");

}

        "⚡",
        "☠",
        "♡",
        "♥",
        "⚔",
        "☯",
        "✪",
        "✯",
        "𓆪"
    ];


    for(let i=0;i<left.length;i++){

        for(let j=0;j<right.length;j++){

            add(
                `${left[i]} ${name} ${right[j]}`
            );

        }

    }


    /* FONT COMBINATIONS */

    add(boldText(name));
    add(italicText(name));
    add(smallText(name));
    add(underlineText(name));
    add(strikeText(name));
    add(spacedText(name));

    add(`『${boldText(name)}』`);
    add(`꧁${boldText(name)}꧂`);
    add(`亗${boldText(name)}亗`);
    add(`♛${boldText(name)}♛`);
    add(`♡${italicText(name)}♡`);
    add(`✦${italicText(name)}✦`);


    return styles;

}


/* =========================================================
   GENERATE
========================================================= */

function generate(){

    const input =
        document
        .getElementById("nameInput")
        .value
        .trim();

    if(!input){

        showToast("Please enter your name");

        return;

    }

    generatedNames =
        makeStyles(
            input,
            currentStyle
        );

    currentPage = 1;

    totalPages =
        Math.max(
            1,
            Math.ceil(
                generatedNames.length /
                PAGE_SIZE
            )
        );

    renderGenerated();

    document
        .getElementById("previewText")
        .textContent =
        generatedNames[0] || input;

}


/* =========================================================
   RENDER GENERATED
========================================================= */

function renderGenerated(){

    const results =
        document.getElementById("results");

    results.innerHTML = "";

    const start =
        (currentPage - 1) *
        PAGE_SIZE;

    const end =
        start + PAGE_SIZE;

    const pageItems =
        generatedNames.slice(start,end);


    if(pageItems.length === 0){

        results.innerHTML =
            `<div class="loading">
                No styles found.
             </div>`;

        return;

    }


    pageItems.forEach((name,index)=>{

        createCard(
            name,
            results,
            start + index
        );

    });


    updatePagination();

}


/* =========================================================
   CREATE CARD
========================================================= */

function createCard(name,parent,index){

    const card =
        document.createElement("div");

    card.className =
        "nameCard";


    const content =
        document.createElement("div");

    content.className =
        "nameContent";

    content.textContent =
        name;


    const actions =
        document.createElement("div");

    actions.className =
        "cardActions";


    const copy =
        document.createElement("button");

    copy.className =
        "actionBtn copyBtn";

    copy.textContent =
        "COPY";

    copy.onclick =
        () => copyName(name);


    const deco =
        document.createElement("button");

    deco.className =
        "actionBtn";

    deco.textContent =
        "✨ DECO";

    deco.onclick =
        () => {

            document
                .getElementById("previewText")
                .textContent =
                name;

            saveRecent(name);

        };


    actions.appendChild(copy);
    actions.appendChild(deco);

    card.appendChild(content);
    card.appendChild(actions);

    parent.appendChild(card);

}


/* =========================================================
   COPY
========================================================= */

async function copyName(name){

    try{

        await navigator.clipboard.writeText(name);

        showToast("Name copied!");

    }catch(error){

        const temp =
            document.createElement("textarea");

        temp.value = name;

        document.body.appendChild(temp);

        temp.select();

        document.execCommand("copy");

        temp.remove();

        showToast("Name copied!");

    }

}


/* =========================================================
   CATEGORY
========================================================= */

function selectStyle(style,button){

    currentStyle = style;

    document
        .querySelectorAll(".catBtn")
        .forEach(btn=>{
            btn.classList.remove("active");
        });

    button.classList.add("active");

    const input =
        document
        .getElementById("nameInput")
        .value
        .trim();

    if(input){

        generate();

    }else{

        loadDatabaseNames(style);

    }

}


/* =========================================================
   SUPABASE DATABASE
========================================================= */

async function loadDatabaseNames(category){

    const results =
        document.getElementById("results");

    results.innerHTML =
        `<div class="loading">
            Loading names...
         </div>`;

    currentPage = 1;


    let query =
        supabaseClient
        .from("names")
        .select(
            "id,name,category",
            {count:"exact"}
        )
        .order(
            "id",
            {ascending:false}
        );


    if(category !== "All"){

        query =
            query.eq(
                "category",
                category
            );

    }


    const from = 0;

    const to =
        PAGE_SIZE - 1;


    const {
        data,
        error,
        count
    } =
        await query.range(
            from,
            to
        );


    if(error){

        console.error(error);

        results.innerHTML =
            `<div class="loading">
                Database connection error.
             </div>`;

        return;

    }


    dbNames = data || [];

    totalPages =
        Math.max(
            1,
            Math.ceil(
                (count || dbNames.length) /
                PAGE_SIZE
            )
        );


    renderDatabase();

}


/* =========================================================
   DATABASE RENDER
========================================================= */

function renderDatabase(){

    const results =
        document.getElementById("results");

    results.innerHTML = "";


    if(!dbNames.length){

        results.innerHTML =
            `<div class="loading">
                No names found in this category.
             </div>`;

        return;

    }


    dbNames.forEach((item,index)=>{

        createCard(
            item.name,
            results,
            index
        );

    });


    updatePagination();

}


/* =========================================================
   DATABASE PAGE
========================================================= */

async function loadDatabasePage(){

    const results =
        document.getElementById("results");

    results.innerHTML =
        `<div class="loading">
            Loading...
         </div>`;


    let query =
        supabaseClient
        .from("names")
        .select(
            "id,name,category",
            {count:"exact"}
        )
        .order(
            "id",
            {ascending:false}
        );


    if(currentStyle !== "All"){

        query =
            query.eq(
                "category",
                currentStyle
            );

    }


    const from =
        (currentPage - 1) *
        PAGE_SIZE;

    const to =
        from + PAGE_SIZE - 1;


    const {
        data,
        error,
        count
    } =
        await query.range(
            from,
            to
        );


    if(error){

        console.error(error);

        results.innerHTML =
            `<div class="loading">
                Unable to load names.
             </div>`;

        return;

    }


    dbNames = data || [];


    totalPages =
        Math.max(
            1,
            Math.ceil(
                (count || 0) /
                PAGE_SIZE
            )
        );


    renderDatabase();

}


/* =========================================================
   PAGINATION
========================================================= */

function updatePagination(){

    document
        .getElementById("pageInfo")
        .textContent =
        `Page ${currentPage} / ${totalPages}`;


    document
        .getElementById("prevBtn")
        .disabled =
        currentPage <= 1;


    document
        .getElementById("nextBtn")
        .disabled =
        currentPage >= totalPages;

}


function nextPage(){

    if(currentPage >= totalPages)
        return;


    currentPage++;


    if(
        generatedNames.length &&
        document
        .getElementById("nameInput")
        .value
        .trim()
    ){

        renderGenerated();

    }else{

        loadDatabasePage();

    }

}


function previousPage(){

    if(currentPage <= 1)
        return;


    currentPage--;


    if(
        generatedNames.length &&
        document
        .getElementById("nameInput")
        .value
        .trim()
    ){

        renderGenerated();

    }else{

        loadDatabasePage();

    }

}


/* =========================================================
   CLEAR
========================================================= */

function clearInput(){

    document
        .getElementById("nameInput")
        .value = "";

    generatedNames = [];

    document
        .getElementById("previewText")
        .textContent =
        "꧁༺ Name Art ༻꧂";

    loadDatabaseNames(currentStyle);

}


/* =========================================================
   RECENT
========================================================= */

function saveRecent(name){

    let recent =
        JSON.parse(
            localStorage.getItem("namecraft_recent")
            || "[]"
        );


    recent =
        recent.filter(
            item => item !== name
        );


    recent.unshift(name);


    recent =
        recent.slice(0,10);


    localStorage.setItem(
        "namecraft_recent",
        JSON.stringify(recent)
    );


    renderRecent();

}


function renderRecent(){

    const list =
        document.getElementById("recentList");

    list.innerHTML = "";


    const recent =
        JSON.parse(
            localStorage.getItem("namecraft_recent")
            || "[]"
        );


    if(!recent.length){

        list.innerHTML =
            `<div class="loading">
                Your recent styles will appear here.
             </div>`;

        return;

    }


    recent.forEach(name=>{

        const item =
            document.createElement("div");

        item.className =
            "recentItem";

        item.textContent =
            name;

        item.onclick =
            () => copyName(name);

        list.appendChild(item);

    });

}


/* =========================================================
   SHARE
========================================================= */

function getShareText(){

    const name =
        document
        .getElementById("previewText")
        .textContent;

    return encodeURIComponent(
        "Check my stylish name: " + name
    );

}


function shareFacebook(){

    const url =
        encodeURIComponent(
            location.href
        );

    window.open(
        `https://www.facebook.com/sharer/sharer.php?u=${url}`,
        "_blank"
    );

}


function shareTwitter(){

    const text =
        getShareText();

    window.open(
        `https://twitter.com/intent/tweet?text=${text}`,
        "_blank"
    );

}


function shareEmail(){

    const text =
        getShareText();

    location.href =
        `mailto:?subject=My Stylish Name&body=${text}`;

}


function shareWhatsApp(){

    const text =
        getShareText();

    window.open(
        `https://wa.me/?text=${text}`,
        "_blank"
    );

}


function shareTelegram(){

    const text =
        getShareText();

    const url =
        encodeURIComponent(
            location.href
        );

    window.open(
        `https://t.me/share/url?url=${url}&text=${text}`,
        "_blank"
    );

}


/* =========================================================
   TOAST
========================================================= */

let toastTimer;

function showToast(message){

    const toast =
        document.getElementById("toast");

    toast.textContent =
        message;

    toast.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer =
        setTimeout(()=>{
            toast.classList.remove("show");
        },1800);

}


/* =========================================================
   INPUT EVENTS
========================================================= */

document
.getElementById("nameInput")
.addEventListener(
    "input",
    function(){

        const value =
            this.value.trim();


        if(value){

            generatedNames =
                makeStyles(
                    value,
                    currentStyle
                );

            currentPage = 1;

            totalPages =
                Math.max(
                    1,
                    Math.ceil(
                        generatedNames.length /
                        PAGE_SIZE
                    )
                );

            renderGenerated();

            document
                .getElementById("previewText")
                .textContent =
                generatedNames[0] || value;

        }else{

            generatedNames = [];

            loadDatabaseNames(
                currentStyle
            );

            document
                .getElementById("previewText")
                .textContent =
                "꧁༺ Name Art ༻꧂";

        }

    }
);


/* =========================================================
   ENTER = FIRST STYLE
========================================================= */

document
.getElementById("nameInput")
.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter" &&
            !event.shiftKey
        ){

            event.preventDefault();

            generate();

        }

    }
);


/* =========================================================
   START
========================================================= */

renderRecent();

loadDatabaseNames("Symbolic");

</script>
