}

    font-size:30px;

}

.shareText{

.shareBtn{

    font-size:20px;

.twitter{

.email{

.whatsapp{

/* ================= RESULTS ================= */

function convertText(text,map){

return [...text]
.map(c=>map[c]||c)
.join("");

}

function boldText(text){

return convertText(text,boldMap);

}

function italicText(text){

function smallText(text){

return convertText(

smallMap
);

}

.map(c=>c+"\u0332")
.join("");

}

function strikeText(text){

.map(c=>c+"\u0336")
.join("");

add(`𓆩 ${name} 𓆪`);
add(`୨୧ ${name} ୨୧`);
add(`✿ ${name} ✿`);
add(`❀ ${name} ❀`);
add(`☁ ${name} ☁`);

}


/* DANGER */

if(category==="Danger"){

add(`☠ ${name} ☠`);
add(`⚠ ${name} ⚠`);
add(`☣ ${name} ☣`);
add(`💀 ${name} 💀`);
add(`༒ ${name} ༒`);
add(`⚔ ${name} ⚔`);
add(`⛓ ${name} ⛓`);
add(`『☠ ${name} ☠』`);

}


/* MANY SYMBOL COMBINATIONS */

const left=[
"꧁༺","꧁༒","亗","乂","メ",
"彡","〆","『","【","《",
"♛","♕","★","☆","✦",
"✧","⚡","☠","♡","♥",

];

"༻꧂","༒꧂","亗","乂","メ",

"♛","♕","★","☆","✦",
"✧","⚡","☠","♡","♥",
"⚔","☯","✪","✯","𓆪"
];


for(let i=0;i<left.length;i++){

for(let j=0;j<right.length;j++){

add(

);

}

}


/* FONT STYLES */

add(boldText(name));
add(italicText(name));
add(smallText(name));
add(underlineText(name));
add(strikeText(name));
add(spacedText(name));

add(`『${boldText(name)}』`);
add(`꧁${boldText(name)}꧂`);
add(`亗${boldText(name)}亗`);
add(`♛${boldText(name)}♛`);
add(`♡${italicText(name)}♡`);
add(`✦${italicText(name)}✦`);


return styles;

}


/* =========================================================
   GENERATE
========================================================= */

function generate(){

const input=
document
.getElementById("nameInput")
.value
.trim();


if(!input){

showToast(
"Please enter your name"
);

return;

}


generatedNames=
makeStyles(
input,
currentStyle
);

currentPage=1;

totalPages=
Math.max(
1,
Math.ceil(
generatedNames.length/
PAGE_SIZE
)
);


renderGenerated();


document
.getElementById("previewText")
.textContent=
generatedNames[0]?.text ||
input;

}


/* =========================================================
   RENDER GENERATED
========================================================= */

function renderGenerated(){

const results=
document.getElementById("results");

results.innerHTML="";


const start=
(currentPage-1)*
PAGE_SIZE;

const end=
start+PAGE_SIZE;


const pageItems=
generatedNames
.slice(start,end);


if(!pageItems.length){

results.innerHTML=
`<div class="loading">
No styles found.
</div>`;

return;

}


pageItems.forEach((item,index)=>{

createCard(
item.text,
item.font,
results
);

});


updatePagination();

}


/* =========================================================
   CREATE CARD
========================================================= */

function createCard(
name,
fontClass,
parent
){

const card=
document.createElement("div");

card.className=
"nameCard";


const content=
document.createElement("div");

content.className=
`nameContent ${fontClass}`;

content.textContent=
name;


const actions=
document.createElement("div");

actions.className=
"cardActions";


const copy=
document.createElement("button");

copy.className=
"actionBtn copyBtn";

copy.textContent=
"COPY";

copy.onclick=
()=>{
copyName(name);
};


const deco=
document.createElement("button");

deco.className=
"actionBtn";

deco.textContent=
"✨ DECO";

deco.onclick=
()=>{

document
.getElementById("previewText")
.textContent=
name;

document
.getElementById("previewText")
.className=
`previewText ${fontClass}`;

saveRecent(
name,
fontClass
);

};


actions.appendChild(copy);
actions.appendChild(deco);

card.appendChild(content);
card.appendChild(actions);

parent.appendChild(card);

}


/* =========================================================
   COPY
========================================================= */

async function copyName(name){

try{

await navigator
.clipboard
.writeText(name);

showToast(
"Name copied!"
);

}catch(error){

const temp=
document.createElement("textarea");

temp.value=name;

document.body.appendChild(temp);

temp.select();

document.execCommand("copy");

temp.remove();

showToast(
"Name copied!"
);

}

}


/* =========================================================
   CATEGORY
========================================================= */

function selectStyle(
style,
button
){

currentStyle=style;

document
.querySelectorAll(".catBtn")
.forEach(btn=>{
btn.classList.remove("active");
});

button.classList.add("active");


const input=
document
.getElementById("nameInput")
.value
.trim();


if(input){

generate();

}else{

loadDatabaseNames(style);

}

}


/* =========================================================
   SUPABASE
========================================================= */

async function loadDatabaseNames(
category
){

const results=
document.getElementById("results");

results.innerHTML=
`<div class="loading">
Loading names...
</div>`;


currentPage=1;


let query=
supabaseClient
.from("names")
.select(
"id,name,category",
{count:"exact"}
)
.order(
"id",
{ascending:false}
);


if(category!=="All"){

query=
query.eq(
"category",
category
);

}


const {
data,
error,
count
}=
await query.range(
0,
PAGE_SIZE-1
);


if(error){

console.error(error);

results.innerHTML=
`<div class="loading">
Database connection error.
</div>`;

return;

}


dbNames=
data||[];


totalPages=
Math.max(
1,
Math.ceil(
(count||dbNames.length)/
PAGE_SIZE
)
);


renderDatabase();

}


/* =========================================================
   DATABASE RENDER
========================================================= */

function renderDatabase(){

const results=
document.getElementById("results");

results.innerHTML="";


if(!dbNames.length){

results.innerHTML=
`<div class="loading">
No names found.
</div>`;

return;

}


dbNames.forEach(
(item,index)=>{

const fontClass=
"font"+
((index%20)+1);

createCard(
item.name,
fontClass,
results
);

});


updatePagination();

}


/* =========================================================
   DATABASE PAGE
========================================================= */

async function loadDatabasePage(){

const results=
document.getElementById("results");

results.innerHTML=
`<div class="loading">
Loading...
</div>`;


let query=
supabaseClient
.from("names")
.select(
"id,name,category",
{count:"exact"}
)
.order(
"id",
{ascending:false}
);


if(currentStyle!=="All"){

query=
query.eq(
"category",
currentStyle
);

}


const from=
(currentPage-1)*
PAGE_SIZE;

const to=
from+PAGE_SIZE-1;


const {
data,
error,
count
}=
await query.range(
from,
to
);


if(error){

console.error(error);

results.innerHTML=
`<div class="loading">
Unable to load names.
</div>`;

return;

}


dbNames=
data||[];


totalPages=
Math.max(
1,
Math.ceil(
(count||0)/
PAGE_SIZE
)
);


renderDatabase();

}


/* =========================================================
   PAGINATION
========================================================= */

function updatePagination(){

document
.getElementById("pageInfo")
.textContent=
`Page ${currentPage} / ${totalPages}`;


document
.getElementById("prevBtn")
.disabled=
currentPage<=1;


document
.getElementById("nextBtn")
.disabled=
currentPage>=totalPages;

}


function nextPage(){

if(currentPage>=totalPages)
return;


currentPage++;


const input=
document
.getElementById("nameInput")
.value
.trim();


if(input){

renderGenerated();

}else{

loadDatabasePage();

}

}


function previousPage(){

if(currentPage<=1)
return;


currentPage--;


const input=
document
.getElementById("nameInput")
.value
.trim();


if(input){

renderGenerated();

}else{

loadDatabasePage();

}

}


/* =========================================================
   CLEAR
========================================================= */

function clearInput(){

document
.getElementById("nameInput")
.value="";

generatedNames=[];


const preview=
document.getElementById("previewText");

preview.textContent=
"꧁༺ NameCraft ༻꧂";

preview.className=
"previewText font1";


loadDatabaseNames(
currentStyle
);

}


/* =========================================================
   RECENT
========================================================= */

function saveRecent(
name,
fontClass
){

let recent=
JSON.parse(
localStorage.getItem(
"namecraft_recent"
)||"[]"
);


recent=
recent.filter(
item=>item.text!==name
);


recent.unshift({
text:name,
font:fontClass
});


recent=
recent.slice(0,10);


localStorage.setItem(
"namecraft_recent",
JSON.stringify(recent)
);


renderRecent();

}


function renderRecent(){

const list=
document.getElementById(
"recentList"
);

list.innerHTML="";


const recent=
JSON.parse(
localStorage.getItem(
"namecraft_recent"
)||"[]"
);


if(!recent.length){

list.innerHTML=
`<div class="loading">
Your recent styles will appear here.
</div>`;

return;

}


recent.forEach(item=>{

const div=
document.createElement("div");

div.className=
`recentItem ${item.font}`;

div.textContent=
item.text;

div.onclick=
()=>{
copyName(item.text);
};

list.appendChild(div);

});

}


/* =========================================================
   SHARE
========================================================= */

function getShareText(){

const name=
document
.getElementById("previewText")
.textContent;

return encodeURIComponent(
"Check my stylish name: "+name
);

}

const url=
encodeURIComponent(
location.href
);

window.open(
`https://www.facebook.com/sharer/sharer.php?u=${url}`,
"_blank"
);

}

`https://twitter.com/intent/tweet?text=${getShareText()}`,
"_blank"
);

}


function shareEmail(){

location.href=
`mailto:?subject=My Stylish Name&body=${getShareText()}`;

}


function shareWhatsApp(){

`https://wa.me/?text=${getShareText()}`,
"_blank"
);

}


function shareTelegram(){

const url=
encodeURIComponent(
location.href
);

window.open(
`https://t.me/share/url?url=${url}&text=${getShareText()}`,
"_blank"
);

}


/* =========================================================
   TOAST
========================================================= */

let toastTimer;

function showToast(message){

const toast=
document.getElementById("toast");

toast.textContent=
message;

toast.classList.add("show");

clearTimeout(
toastTimer
);

toastTimer=
setTimeout(
()=>{
toast.classList.remove("show");
},
1800
);

}


/* =========================================================
   LIVE INPUT
========================================================= */

document
.getElementById("nameInput")
.addEventListener(
"input",
function(){

const value=
this.value.trim();


if(value){

generatedNames=
makeStyles(
value,
currentStyle
);

currentPage=1;

totalPages=
Math.max(
1,
Math.ceil(
generatedNames.length/
PAGE_SIZE
)
);

renderGenerated();


if(generatedNames[0]){

const preview=
document.getElementById(
"previewText"
);

preview.textContent=
generatedNames[0].text;

preview.className=
`previewText ${generatedNames[0].font}`;

}

}else{

generatedNames=[];

loadDatabaseNames(
currentStyle
);

const preview=
document.getElementById(
"previewText"
);

preview.textContent=
"꧁༺ NameCraft ༻꧂";

preview.className=
"previewText font1";

}

}
);


/* =========================================================
   ENTER KEY
========================================================= */

document
.getElementById("nameInput")
.addEventListener(
"keydown",
function(event){

if(
event.key==="Enter" &&
!event.shiftKey
){

event.preventDefault();

generate();

}

}
);


/* =========================================================
   START
========================================================= */

renderRecent();

loadDatabaseNames(
"Symbolic"
);

</script>
