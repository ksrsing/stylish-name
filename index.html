<html lang="en">

<title>NameCraft - Stylish Name Generator</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:linear-gradient(135deg,#08001c,#150044,#050014);
    color:white;
    min-height:100vh;
}

nav{
    width:100%;
    padding:18px 7%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:rgba(0,0,0,.35);
    position:sticky;
    top:0;
    z-index:100;
    backdrop-filter:blur(10px);
}

.logo{
    font-size:25px;
    font-weight:bold;
    color:#b96cff;
}

nav a{
    color:white;
    text-decoration:none;
    margin-left:20px;
    font-size:14px;
}

.hero{
    text-align:center;
    padding:70px 15px 40px;
}

.hero h1{
    font-size:42px;
    margin-bottom:12px;
}

.hero h1 span{
    color:#b96cff;
}

.hero p{
    color:#bbb;
    margin-bottom:30px;
}

.searchBox{
    max-width:650px;
    margin:auto;
    display:flex;
    gap:10px;
}

.searchBox input{
    flex:1;
    padding:16px;
    border:none;
    outline:none;
    border-radius:12px;
    font-size:16px;
}

.searchBox button{
    padding:0 25px;
    border:none;
    border-radius:12px;
    background:#8d35ff;
    color:white;
    font-size:16px;
    cursor:pointer;
}

.searchBox button:hover{
    background:#a957ff;
}

.categories{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:10px;
    margin:30px auto;
    padding:0 15px;
}

.categories button{
    padding:10px 18px;
    border:1px solid #7135bd;
    border-radius:20px;
    background:#18052f;
    color:white;
    cursor:pointer;
}

.categories button:hover{
    background:#7135bd;
}

#count{
    text-align:center;
    color:#aaa;
    margin:20px;
}

.grid{
    width:90%;
    max-width:1200px;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
    padding-bottom:50px;
}

.card{
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.12);
    border-radius:16px;
    padding:20px 12px;
    text-align:center;
    transition:.3s;
}

.card:hover{
    transform:translateY(-5px);
    border-color:#a64cff;
    box-shadow:0 0 20px rgba(166,76,255,.25);
}

.name{
    min-height:65px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:25px;
    word-break:break-word;
    margin-bottom:15px;
}

.buttons{
    display:flex;
    justify-content:center;
    gap:8px;
}

.buttons button{
    border:none;
    border-radius:8px;
    padding:8px 12px;
    cursor:pointer;
    color:white;
    background:#52209a;
}

.buttons button:hover{
    background:#793bd0;
}

footer{
    text-align:center;
    padding:25px;
    background:rgba(0,0,0,.3);
    color:#999;
}

/* Different styles */

.s1{font-family:Georgia,serif;font-weight:bold}
.s2{font-family:"Courier New",monospace;font-weight:bold}
.s3{font-family:Impact,sans-serif;letter-spacing:2px}
.s4{font-family:cursive;font-weight:bold}
.s5{font-family:Trebuchet MS,sans-serif;font-style:italic;font-weight:bold}
.s6{font-family:Arial Black,sans-serif}
.s7{font-family:Verdana,sans-serif;letter-spacing:3px}
.s8{font-family:serif;font-style:italic}
.s9{font-family:monospace;letter-spacing:2px}
.s10{font-family:Tahoma,sans-serif;font-weight:bold}

@media(max-width:900px){
    .grid{
        grid-template-columns:repeat(2,1fr);
    }

    .hero h1{
        font-size:34px;
    }
}

@media(max-width:500px){
    nav{
        padding:15px;
    }

    nav a{
        margin-left:8px;
        font-size:12px;
    }

    .searchBox{
        flex-direction:column;
    }

    .searchBox button{
        padding:14px;
    }

    .grid{
        grid-template-columns:1fr;
        width:92%;
    }
}
</style>

/* =========================

========================= */

const categories = {
    Gaming: [
        "Gaming","Gamer","King","Queen","Player","Hunter",
        "Sniper","Battle","Game","Warrior","Killer","Master"
    ],

/* =========================
   MAIN DISPLAY
========================= */

const grid = document.getElementById("nameGrid");

function createCard(name,index){

    const design =
        designs[index % designs.length];

    const font =
        fontClasses[index % fontClasses.length];

    const styledName =
        design.replace("NAME",name);

    const card =
        document.createElement("div");

    card.className="card";

    card.innerHTML=`

        <div class="name ${font}">
            ${styledName}
        </div>

        <div class="buttons">

            <button onclick="copyName(this)">
                Copy
            </button>

            <button onclick="favoriteName(this)">
                ♡
            </button>

        </div>
    `;

    return card;
}


function displayNames(list){

    grid.innerHTML="";

    list.forEach((name,index)=>{

        grid.appendChild(
            createCard(name,index)
        );

    });

    document.getElementById("count").innerText =
        list.length + " Stylish Names";
}


/* =========================
   GENERATE
========================= */

function generateNames(){

    const input =
        document.getElementById("nameInput")
        .value
        .trim();

    if(input===""){

        alert("Please enter your name!");

        return;
    }

    const result=[];

    for(let i=0;i<500;i++){

        result.push(input);

    }

    displayNames(result);
}


/* =========================
   SHOW ALL
========================= */

function showAll(){

    displayNames(names);

}


/* =========================
   CATEGORY
========================= */

function generateCategory(category){

    const words =
        categories[category];

    const result =
        names.filter(name=>{

            return words.some(word=>
                name.toLowerCase()
                .includes(word.toLowerCase())
            );

        });

    if(result.length===0){

        alert(
            "Is category ke names abhi available nahi hain."
        );

        return;
    }

    displayNames(result);
}


/* =========================
   COPY
========================= */

function copyName(button){

    const text =
        button
        .parentElement
        .previousElementSibling
        .innerText;

    if(navigator.clipboard){

        navigator.clipboard.writeText(text)
        .then(()=>{

            button.innerText="Copied!";

            setTimeout(()=>{

                button.innerText="Copy";

            },1200);

        });

    }else{

        const temp =
            document.createElement("textarea");

        temp.value=text;

        document.body.appendChild(temp);

        temp.select();

        document.execCommand("copy");

        temp.remove();

        button.innerText="Copied!";

        setTimeout(()=>{

            button.innerText="Copy";

        },1200);

    }

}


/* =========================
   FAVORITE
========================= */

function favoriteName(button){

    if(button.innerText==="♡"){

        button.innerText="♥";

    }else{

        button.innerText="♡";

    }

}


/* =========================
   ENTER KEY
========================= */

document
.getElementById("nameInput")
.addEventListener("keydown",function(event){

    if(event.key==="Enter"){

        generateNames();

    }

});

========================= */
